name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No telemetry from build tools (DECISIONS.md, D-012).
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: pnpm --filter @tooldrop/runtime exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm check:recipes
      # Bundles the published package and fails if it imports an undeclared dependency.
      - run: pnpm build

  postgres:
    # The database tests again, on a real Postgres server through the driver
    # self-hosted toolDrop uses; the main job runs them on PGlite (D-051).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # A throwaway server for this job only, so it needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TOOLDROP_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/db

  docker:
    # Builds the app image and checks that it serves, as `docker compose up` would.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tooldrop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check /health, auth and the first API key
        run: |
          docker run -d --name tooldrop -p 127.0.0.1:3000:3000 tooldrop:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v1/tools)" = 401
          key=$(docker logs tooldrop 2>&1 | grep -o 'td_[A-Za-z0-9_-]*' | head -1)
          curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:3000/v1/tools
          docker exec tooldrop node -e "require('$(docker exec tooldrop npm root --global)/tooldrop/node_modules/playwright').chromium.launch().then((b) => b.close())"

  secrets:
    # Recipes and fixtures must never contain real credentials (recipes/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Scan for secrets with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Findings also become annotations (redacted), so they show on the commit and in pull requests.
          status=0
          ./gitleaks git --no-banner --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --report-format json --report-path findings.json "$GITHUB_WORKSPACE" || status=$?
          if [ "$status" -ne 0 ] && [ -s findings.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks rule \(.RuleID) matched in commit \(.Commit[0:7])"' findings.json
          fi
          exit "$status"
