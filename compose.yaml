# toolDrop, self-hosted: docker compose up
# Guide: https://nabeelali0707.github.io/toolDrop/self-hosting
#
# - toolDrop listens on http://127.0.0.1:3000 (REST, and MCP at /mcp). Its first API
#   key is printed once at first start: docker compose logs app
# - Ollama runs next to it, and the `models` service downloads the models on first
#   start. On macOS, run Ollama natively instead (Docker cannot use the Apple GPU):
#   docker compose up app, with OLLAMA_HOST=http://host.docker.internal:11434
# - Postgres and Valkey join this file with self-hosted mode (PLAN.md, Phase 5). Until
#   then toolDrop keeps its data in SQLite on the tooldrop-data volume.
name: tooldrop

services:
  app:
    image: ghcr.io/nabeelali0707/tooldrop:latest
    build: .
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - tooldrop-data:/data
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # Downloads the models once; later starts find them on the volume and exit at once.
  # 7B suits most machines; with 16 GB of RAM or more, set TOOLDROP_CODE_MODEL=qwen2.5-coder:14b.
  models:
    image: ollama/ollama:0.40.11
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull ${TOOLDROP_CODE_MODEL:-qwen2.5-coder:7b} &&
        ollama pull ${TOOLDROP_REASONING_MODEL:-llama3.1:8b}
    restart: 'no'

volumes:
  tooldrop-data:
  ollama-models:
